<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangar Tool Store</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#12203b;--muted:#5a667c;--accent:#0b5fff;--amber:#ffb400;--line:#dbe1ec;--tile:#e7edfb;--ok:#0f8a4b;--warn:#b7791f;--bad:#c53030;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161f33;--text:#eaf0fb;--muted:#9aa8c2;--accent:#6ea0ff;--line:#2a3550;--tile:#1f2c4a;--ok:#4cd68b;--warn:#f0b84a;--bad:#ff7b7b;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,#0a1f44,#12408f);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 22px}
.wrap{max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:1.35rem;line-height:1.15}
.sub{margin:2px 0 0;opacity:.8;font-size:.88rem}
input,textarea,select,button{font:inherit;color:var(--text)}
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
header button.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
button.danger{background:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar input{flex:1;min-width:170px;width:auto;color:#12203b}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;max-width:1000px;margin:0 auto}
.chip{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#banner{display:none;background:var(--amber);color:#0a1f44;text-align:center;padding:6px 12px;font-size:.85rem;font-weight:600}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;max-width:1000px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.pic{aspect-ratio:4/3;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:3.4rem}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:12px 14px 14px}
.body h3{margin:0 0 6px;font-size:1.02rem}
.meta{color:var(--muted);font-size:.82rem;margin-top:6px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tile);color:var(--accent);margin-right:4px}
.b-ok{color:var(--ok)}.b-warn{color:var(--warn)}.b-bad{color:var(--bad)}
.tag.b{background:transparent;border:1px solid currentColor}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(460px,94vw);max-height:92vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#big{width:100%;border-radius:12px;max-height:300px;object-fit:cover;background:var(--tile);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:5rem;overflow:hidden}
#big img{width:100%;height:100%;object-fit:cover}
#prev{max-width:100%;max-height:130px;border-radius:10px;margin-top:8px;display:none}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.center{text-align:center}
.note{font-size:.8rem;color:var(--muted);text-align:center;padding:0 16px 24px}
@media print{header,.chips,main,.note,#banner{display:none}#qrDlg .row{display:none}}
</style>
</head>

<div><h1 id="college">Asian Aviation Centre</h1><p class="sub">Hangar Tool Store</p></div>
</div>
<div class="bar">
<input id="q" type="search" placeholder="Search tools…" aria-label="Search tools">
<button id="add" style="display:none">+ Add tool</button>
<button id="qrbtn" class="ghost">QR code</button>
<button id="auth" class="ghost">Staff login</button>
</div>
</div></header>
<div class="chips" id="chips"></div>
<main id="grid"></main>
<p class="note">Scan the QR code in the hangar to open this page.</p>

<dialog id="viewDlg">
<div id="big"></div>
<h2 id="vName" style="margin:12px 0 4px"></h2>
<div id="vTags"></div>
<p id="vPurpose"></p>
<div class="meta" id="vMeta"></div>
<div class="row"><button class="ghost" id="vEdit">Edit</button><button class="danger" id="vDel">Delete</button><button id="vClose">Close</button></div>
</dialog>

<dialog id="formDlg">
<h2 id="fTitle" style="margin:0">Add a tool</h2>
<label for="n">Tool name</label><input id="n" maxlength="60">
<label for="p">Purpose</label><textarea id="p" rows="3" maxlength="300" placeholder="What is it used for?"></textarea>
<div class="two">
<div><label for="c">Category</label><select id="c"></select></div>
<div><label for="cd">Condition</label><select id="cd"></select></div>
<div><label for="no">Tool number</label><input id="no" maxlength="30" placeholder="e.g. TW-014"></div>
<div><label for="lc">Shelf location</label><input id="lc" maxlength="40" placeholder="e.g. Rack B, Shelf 2"></div>
</div>
<label for="f">Photo</label><input id="f" type="file" accept="image/*">
<img id="prev" alt="Preview">
<div class="row"><button class="ghost" id="fCancel">Cancel</button><button id="save">Save tool</button></div>
</dialog>

<dialog id="loginDlg">
<h2 style="margin:0">Staff login</h2>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<div class="row"><button class="ghost" id="lCancel">Cancel</button><button id="lGo">Log in</button></div>
</dialog>

<dialog id="qrDlg">
<div class="center"><h2 style="margin:0 0 12px">Scan to open the tool store</h2><div id="qr"></div>
<p style="color:var(--muted);font-size:.85rem;word-break:break-all" id="url"></p></div>
<div class="row"><button class="ghost" onclick="window.print()">Print</button><button id="qrClose">Close</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== SETTINGS: edit these lines ===== */
var CFG={
 college:'Asian Aviation Centre',
 supabaseUrl:'',   // paste your Supabase Project URL
 supabaseKey:''    // paste your Supabase anon (public) key
};
/* ====================================== */
var CATS=['Hand tools','Measuring','Power tools','Electrical','Safety','Other'];
var CONDS=['Serviceable','Calibration due','Needs repair','Out of service'];
var CCLS=['b-ok','b-warn','b-warn','b-bad'];
var EMO={'Hand tools':'🔧','Measuring':'📏','Power tools':'🔩','Electrical':'⚡','Safety':'🦺','Other':'🧰'};
var KEY='hangar-tools-v2',live=!!(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase),sb=null;
var tools=[],cat='All',staff=false,editId=null,img='',viewId=null;
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('college').textContent=CFG.college;document.title=CFG.college+' – Tool Store';
var seed=[
{id:'1',name:'Torque wrench',purpose:'Tightens bolts and nuts to an exact torque so fasteners are neither loose nor over-stressed.',category:'Hand tools',tool_no:'TW-014',location:'Rack A, Shelf 1',condition:'Calibration due'},
{id:'2',name:'Safety wire pliers',purpose:'Twist and cut lockwire to stop fasteners backing off from vibration.',category:'Hand tools',tool_no:'SW-003',location:'Rack A, Shelf 2',condition:'Serviceable'},
{id:'3',name:'Feeler gauge',purpose:'Measures tiny gaps, such as valve or spark plug clearances.',category:'Measuring',tool_no:'FG-021',location:'Cabinet 2',condition:'Serviceable'},
{id:'4',name:'Digital multimeter',purpose:'Checks voltage, current and continuity when troubleshooting aircraft wiring.',category:'Electrical',tool_no:'MM-007',location:'Cabinet 3',condition:'Serviceable'},
{id:'5',name:'Rivet gun',purpose:'Drives rivets to join sheet-metal skin and structural panels.',category:'Power tools',tool_no:'RG-002',location:'Rack C',condition:'Needs repair'}];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tools))}catch(e){alert('Storage is full. Try a smaller photo.')}}
async function load(){
 if(live){var r=await sb.from('tools').select('*').order('created_at',{ascending:false});if(r.error){alert('Could not load tools: '+r.error.message);return}tools=r.data}
 else{try{var s=localStorage.getItem(KEY);tools=s?JSON.parse(s):seed.slice()}catch(e){tools=seed.slice()}}
 render();
}
function setStaff(v){staff=v;$('add').style.display=v?'':'none';$('auth').textContent=v?'Sign out':'Staff login'}
function render(){
 var h='';['All'].concat(CATS).forEach(function(c){h+='<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'});
 $('chips').innerHTML=h;
 var q=$('q').value.toLowerCase();h='';
 tools.forEach(function(t){
  if(cat!=='All'&&t.category!==cat)return;
  if((t.name+' '+t.purpose+' '+(t.tool_no||'')).toLowerCase().indexOf(q)<0)return;
  var ci=CONDS.indexOf(t.condition);
  h+='<article class="card" data-id="'+esc(t.id)+'"><div class="pic">'+(t.image?'<img alt="'+esc(t.name)+'" src="'+t.image+'">':(EMO[t.category]||'🧰'))+'</div><div class="body"><h3>'+esc(t.name)+'</h3><span class="tag">'+esc(t.category||'Other')+'</span>'+(ci>=0?'<span class="tag b '+CCLS[ci]+'">'+esc(t.condition)+'</span>':'')+'<div class="meta">'+(t.tool_no?'No. '+esc(t.tool_no):'')+(t.location?' · '+esc(t.location):'')+'</div></div></article>';
 });
 $('grid').innerHTML=h||'<div class="empty">No tools found.</div>';
}
function find(id){return tools.filter(function(t){return String(t.id)===String(id)})[0]}
$('q').oninput=render;
$('chips').onclick=function(e){var c=e.target.getAttribute('data-c');if(c){cat=c;render()}};
$('grid').onclick=function(e){
 var a=e.target.closest('.card');if(!a)return;var t=find(a.getAttribute('data-id'));if(!t)return;
 viewId=t.id;$('big').innerHTML=t.image?'<img alt="" src="'+t.image+'">':(EMO[t.category]||'🧰');
 $('vName').textContent=t.name;$('vPurpose').textContent=t.purpose;
 var ci=CONDS.indexOf(t.condition);
 $('vTags').innerHTML='<span class="tag">'+esc(t.category||'Other')+'</span>'+(ci>=0?'<span class="tag b '+CCLS[ci]+'">'+esc(t.condition)+'</span>':'');
 $('vMeta').textContent=[t.tool_no?'Tool number: '+t.tool_no:'',t.location?'Location: '+t.location:''].filter(Boolean).join('  ·  ');
 $('vEdit').style.display=$('vDel').style.display=staff?'':'none';
 $('viewDlg').showModal();
};
$('vClose').onclick=function(){$('viewDlg').close()};
$('c').innerHTML=CATS.map(function(c){return'<option>'+c+'</option>'}).join('');
$('cd').innerHTML=CONDS.map(function(c){return'<option>'+c+'</option>'}).join('');
function openForm(t){
 editId=t?t.id:null;img=t&&t.image?t.image:'';
 $('fTitle').textContent=t?'Edit tool':'Add a tool';
 $('n').value=t?t.name:'';$('p').value=t?t.purpose:'';$('c').value=t?t.category:CATS[0];$('cd').value=t?t.condition:CONDS[0];
 $('no').value=t&&t.tool_no||'';$('lc').value=t&&t.location||'';$('f').value='';
 $('prev').src=img;$('prev').style.display=img?'block':'none';$('formDlg').showModal();
}
$('add').onclick=function(){openForm(null)};
$('vEdit').onclick=function(){$('viewDlg').close();openForm(find(viewId))};
$('fCancel').onclick=function(){$('formDlg').close()};
$('f').onchange=function(e){
 var file=e.target.files[0];if(!file)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){
  var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  img=c.toDataURL('image/jpeg',.7);$('prev').src=img;$('prev').style.display='block'};im.src=r.result};
 r.readAsDataURL(file);
};
$('save').onclick=async function(){
 var o={name:$('n').value.trim(),purpose:$('p').value.trim(),category:$('c').value,condition:$('cd').value,tool_no:$('no').value.trim(),location:$('lc').value.trim(),image:img};
 if(!o.name||!o.purpose){alert('Please enter a name and a purpose.');return}
 if(live){
  var r=editId?await sb.from('tools').update(o).eq('id',editId):await sb.from('tools').insert(o);
  if(r.error){alert('Could not save: '+r.error.message);return}
  await load();
 }else{
  if(editId){var t=find(editId);for(var k in o)t[k]=o[k]}else{o.id=String(Date.now());tools.unshift(o)}
  persist();render();
 }
 $('formDlg').close();
};
$('vDel').onclick=async function(){
 if(!confirm('Delete this tool?'))return;
 if(live){var r=await sb.from('tools').delete().eq('id',viewId);if(r.error){alert('Could not delete: '+r.error.message);return}await load()}
 else{tools=tools.filter(function(t){return String(t.id)!==String(viewId)});persist();render()}
 $('viewDlg').close();
};
$('auth').onclick=async function(){
 if(staff){if(live)await sb.auth.signOut();setStaff(false)}else{$('loginDlg').showModal()}
};
$('lCancel').onclick=function(){$('loginDlg').close()};
$('lGo').onclick=async function(){
 if(!live){setStaff(true);$('loginDlg').close();return}
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){alert('Login failed: '+r.error.message);return}
 $('pw').value='';setStaff(true);$('loginDlg').close();
};
var made=false;
$('qrbtn').onclick=function(){
 var u=location.href.split('#')[0];
 if(!made&&window.QRCode){new QRCode($('qr'),{text:u,width:220,height:220});made=true}
 $('url').textContent=u;$('qrDlg').showModal();
};
$('qrClose').onclick=function(){$('qrDlg').close()};
(async function(){
 if(live){sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);var s=await sb.auth.getSession();setStaff(!!(s.data&&s.data.session))}
 else{$('banner').style.display='block'}
 load();
})();
</script>
</body>
</html>
