<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangar Tool Store</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#14213d;--muted:#5b667a;--accent:#0b5fff;--line:#dde3ec;--tile:#e8eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--text:#eaf0fb;--muted:#9aa8c2;--accent:#6ea0ff;--line:#2a3550;--tile:#1f2c4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--text:#eaf0fb;--muted:#9aa8c2;--accent:#6ea0ff;--line:#2a3550;--tile:#1f2c4a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{padding:20px 16px 8px;max-width:960px;margin:0 auto}
h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;max-width:960px;margin:12px auto;padding:0 16px}
input,textarea,button{font:inherit;color:var(--text)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.bar input{flex:1;min-width:180px;width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.del{background:transparent;color:var(--muted);border:0;padding:4px 8px;font-weight:400;font-size:.85rem}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:960px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:12px 14px 8px;flex:1}
.body h3{margin:0 0 4px;font-size:1.05rem}
.body p{margin:0;color:var(--muted);font-size:.92rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.center{text-align:center}
#prev{max-width:100%;max-height:140px;border-radius:10px;margin-top:8px;display:none}
.note{font-size:.8rem;color:var(--muted);text-align:center;padding:0 16px 24px}
</style>
</head>
<body>
<header>
<h1>✈️ Hangar Tool Store</h1>
<p>Scan, search and learn what each tool is for.</p>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Search tools…" aria-label="Search tools">
<button id="add">+ Add tool</button>
<button id="qrbtn" class="ghost">QR code</button>
</div>
<main id="grid"></main>
<p class="note">Demo: tools you add are saved in this browser only.</p>

<dialog id="addDlg">
<h2 style="margin:0">Add a tool</h2>
<label for="n">Tool name</label>
<input id="n" maxlength="60" placeholder="e.g. Torque wrench">
<label for="p">Purpose</label>
<textarea id="p" rows="3" maxlength="300" placeholder="What is it used for?"></textarea>
<label for="f">Photo</label>
<input id="f" type="file" accept="image/*" capture="environment">
<img id="prev" alt="Preview">
<div class="row"><button class="ghost" id="cancel">Cancel</button><button id="save">Save tool</button></div>
</dialog>

<dialog id="qrDlg">
<div class="center">
<h2 style="margin:0 0 12px">Scan to open</h2>
<div id="qr"></div>
<p style="color:var(--muted);font-size:.85rem;word-break:break-all" id="url"></p>
</div>
<div class="row"><button class="ghost" onclick="window.print()">Print</button><button id="qrClose">Close</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var KEY='hangar-tools-v1';
var seed=[
{n:'Torque wrench',p:'Tightens bolts and nuts to an exact torque so fasteners are neither loose nor over-stressed.',e:'🔧'},
{n:'Safety wire pliers',p:'Twist and cut lockwire to stop fasteners from backing off due to vibration.',e:'🪢'},
{n:'Feeler gauge',p:'Measures tiny gaps, such as valve or spark plug clearances.',e:'📏'},
{n:'Digital multimeter',p:'Checks voltage, current and continuity when troubleshooting aircraft wiring.',e:'⚡'},
{n:'Rivet gun',p:'Drives rivets to join sheet-metal skin and structural panels.',e:'🔩'}];
var tools=[];
try{var s=localStorage.getItem(KEY);tools=s?JSON.parse(s):seed.slice()}catch(e){tools=seed.slice()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tools))}catch(e){alert('Storage is full or unavailable. Try a smaller photo.')}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 var q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('grid'),h='';
 tools.forEach(function(t,i){
  if((t.n+' '+t.p).toLowerCase().indexOf(q)<0)return;
  h+='<article class="card"><div class="pic">'+(t.img?'<img alt="'+esc(t.n)+'" src="'+t.img+'">':(t.e||'🧰'))+'</div><div class="body"><h3>'+esc(t.n)+'</h3><p>'+esc(t.p)+'</p></div><div><button class="del" data-i="'+i+'">Remove</button></div></article>';
 });
 g.innerHTML=h||'<div class="empty">No tools found.</div>';
}
document.getElementById('q').oninput=render;
document.getElementById('grid').onclick=function(e){
 var i=e.target.getAttribute('data-i');
 if(i!==null&&confirm('Remove this tool?')){tools.splice(+i,1);persist();render()}
};
var addDlg=document.getElementById('addDlg'),img='';
document.getElementById('add').onclick=function(){img='';['n','p','f'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('prev').style.display='none';addDlg.showModal()};
document.getElementById('cancel').onclick=function(){addDlg.close()};
document.getElementById('f').onchange=function(e){
 var file=e.target.files[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){
  var m=480,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  img=c.toDataURL('image/jpeg',.7);var p=document.getElementById('prev');p.src=img;p.style.display='block';
 };im.src=r.result};
 r.readAsDataURL(file);
};
document.getElementById('save').onclick=function(){
 var n=document.getElementById('n').value.trim(),p=document.getElementById('p').value.trim();
 if(!n||!p){alert('Please enter a name and a purpose.');return}
 tools.unshift({n:n,p:p,img:img});persist();render();addDlg.close();
};
var qrDlg=document.getElementById('qrDlg'),made=false;
document.getElementById('qrbtn').onclick=function(){
 if(!made&&window.QRCode){new QRCode(document.getElementById('qr'),{text:location.href.split('#')[0],width:200,height:200});made=true}
 document.getElementById('url').textContent=location.href.split('#')[0];
 qrDlg.showModal();
};
document.getElementById('qrClose').onclick=function(){qrDlg.close()};
render();
</script>
</body>
</html>
